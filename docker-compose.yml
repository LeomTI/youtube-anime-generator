services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports: ["8001:8000"]
    volumes: ["./data:/app/data", "./secrets:/app/secrets:ro","./secrets:/app/secrets"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    env_file: .env
    ports: ["8501:8501"]
    depends_on: [api]
    restart: unless-stopped
